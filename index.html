<style>
:root{
  --bg:#12151D; --panel:#181C27; --panel2:#1F2430; --line:#2A3142;
  --ink:#EAF0FF; --dim:#8A93AB;
  --cy:#22E3D6; --mg:#FF3D9A; --am:#FFC24B; --ok:#5CE07A;
  --pad: 18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{
  font-family:Nunito,system-ui,sans-serif;
  overscroll-behavior-y:none;
  -webkit-user-select:none;user-select:none;
  min-height:100vh;min-height:100dvh;
}
#grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
#scan{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.18;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.55) 2px 3px)}
#app{position:relative;z-index:2;max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 108px}
h1,h2,h3,.num,.btn,.tabname{font-family:Sora,system-ui,sans-serif}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;
  transition:opacity .45s ease}
#boot.gone{opacity:0;pointer-events:none}
.bootmark{text-align:center}
.bootmark .w{font-family:Sora;font-weight:800;font-size:34px;letter-spacing:.22em;
  color:#fff;text-shadow:0 0 10px var(--cy),0 0 28px rgba(34,227,214,.55);animation:flick 1.5s steps(1) infinite}
.bootmark .s{margin-top:10px;color:var(--dim);letter-spacing:.16em;font-size:11px}
.bootbar{margin:20px auto 0;width:150px;height:3px;background:var(--line);border-radius:99px;overflow:hidden}
.bootbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--mg));animation:fill 1.1s ease forwards}
@keyframes fill{to{width:100%}}
@keyframes flick{0%,92%{opacity:1}93%{opacity:.35}94%{opacity:1}97%{opacity:.6}98%{opacity:1}}

/* ---------- header ---------- */
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.mark{font-family:Sora;font-weight:800;letter-spacing:.2em;font-size:15px;color:#fff;
  text-shadow:0 0 8px rgba(34,227,214,.6)}
.dayline{font-size:12px;color:var(--dim);letter-spacing:.04em}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card.flat{background:transparent;border:none;padding:0}
.label{font-size:11px;letter-spacing:.14em;color:var(--dim);font-family:Sora;font-weight:600}

/* ---------- hero dial ---------- */
.dial{display:grid;place-items:center;position:relative;margin:6px auto 2px;width:210px;height:210px}
.dial svg{position:absolute;inset:0;transform:rotate(-90deg)}
.dial .track{fill:none;stroke:var(--line);stroke-width:5}
.dial .prog{fill:none;stroke:var(--cy);stroke-width:5;stroke-linecap:round;
  filter:drop-shadow(0 0 6px rgba(34,227,214,.75));transition:stroke-dashoffset .6s linear}
.dial .inner{text-align:center;position:relative}
.num{font-weight:800;font-size:74px;line-height:.92;color:#fff;text-shadow:0 0 14px rgba(34,227,214,.5)}
.num.sm{font-size:52px}
.numsub{font-size:12px;color:var(--dim);margin-top:8px;letter-spacing:.1em}
.gate{margin-top:6px;font-size:13px;font-weight:700;color:var(--cy)}
.gate.open{color:var(--ok)}

/* ---------- dose dots ---------- */
.dots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:16px 2px 4px}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid #3B4459}
.dot.used{background:var(--cy);border-color:var(--cy);box-shadow:0 0 7px rgba(34,227,214,.6)}
.dot.over{background:var(--am);border-color:var(--am);box-shadow:0 0 7px rgba(255,194,75,.6)}
.dotsnum{text-align:center;color:var(--dim);font-size:12px;margin-top:10px}

/* ---------- buttons ---------- */
.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  font-weight:600;font-size:15px;padding:15px 12px;border-radius:14px;cursor:pointer;
  transition:transform .08s ease,background .15s ease}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.btn.cy{background:linear-gradient(135deg,rgba(34,227,214,.18),rgba(34,227,214,.06));border-color:rgba(34,227,214,.55);color:#BFFFF9}
.btn.mg{background:linear-gradient(135deg,rgba(255,61,154,.16),rgba(255,61,154,.05));border-color:rgba(255,61,154,.45);color:#FFC4E0}
.btn.ghost{background:transparent}
.btn.wide{flex:none;width:100%}
.btn small{display:block;font-weight:400;font-size:11px;color:var(--dim);margin-top:3px}

/* ---------- streak / lockout ---------- */
.big{font-family:Sora;font-weight:800;font-size:66px;line-height:1;color:#fff;text-align:center;
  text-shadow:0 0 16px rgba(92,224,122,.45)}
.big.lock{text-shadow:0 0 16px rgba(255,194,75,.45);font-size:44px;letter-spacing:.02em}
.center{text-align:center}
.mut{color:var(--dim);font-size:13px;line-height:1.6}

/* ---------- tags ---------- */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag{border:1px solid var(--line);background:var(--panel2);color:var(--dim);
  border-radius:99px;padding:8px 13px;font-size:13px;cursor:pointer}
.tag:active{transform:scale(.96)}
.tag.on{border-color:var(--mg);color:#FFC4E0}

/* ---------- bars ---------- */
.bars{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:14px}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bwrap{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.bfill{width:100%;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,var(--cy),rgba(34,227,214,.25));min-height:2px}
.bfill.over{background:linear-gradient(180deg,var(--am),rgba(255,194,75,.25))}
.bfill.zero{background:rgba(92,224,122,.35)}
.bcap{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,61,154,.55)}
.blab{font-size:9px;color:var(--dim)}

/* ---------- list ---------- */
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:none}
.li b{font-family:Sora;font-weight:600}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.pill.ok{color:var(--ok);border-color:rgba(92,224,122,.4)}
.pill.over{color:var(--am);border-color:rgba(255,194,75,.4)}

/* ---------- fields ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--dim);margin-bottom:7px}
input[type=number],input[type=time],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:12px;padding:13px;font-size:16px;font-family:Nunito;-webkit-user-select:text;user-select:text}
textarea{font-size:12px;min-height:90px;font-family:ui-monospace,monospace}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px 8px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel2);color:var(--dim);font-size:13px;font-family:Nunito;cursor:pointer}
.seg button.on{border-color:var(--cy);color:#BFFFF9;background:rgba(34,227,214,.1)}

/* ---------- tabbar ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(18,21,29,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:9px 0 calc(env(safe-area-inset-bottom) + 9px);
  display:flex;justify-content:space-around}
nav button{background:none;border:none;color:var(--dim);font-size:11px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 20px;font-family:Sora;letter-spacing:.06em}
nav button.on{color:var(--cy)}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(7,9,14,.82);backdrop-filter:blur(6px);
  display:grid;place-items:center;padding:22px}
.modal{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:22px}
.modal h3{margin:0 0 6px;font-size:19px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%) translateY(14px);
  z-index:50;background:var(--panel2);border:1px solid var(--line);border-radius:99px;
  padding:11px 18px;font-size:13px;opacity:0;transition:all .25s ease;pointer-events:none;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="boot"><div class="bootmark">
  <div class="w">DOWNSHIFT</div>
  <div class="s">ONE GEAR AT A TIME</div>
  <div class="bootbar"><i></i></div>
</div></div>

<canvas id="grid"></canvas>
<div id="scan"></div>

<div id="app"></div>
<div id="toast"></div>

<nav id="nav"></nav>

<script>
"use strict";
/* ============================================================
   DOWNSHIFT — gradual THC taper + post-quit reset ladder
   single-file PWA · all state in localStorage
   ============================================================ */
const KEY = "downshift.v1";
const clone = o => JSON.parse(JSON.stringify(o));
const DEFAULTS = {
  v: 1,
  setup: { done:false, baseline:20, taperDays:30, curve:"steady", start:null,
           wakeStart:"08:00", wakeEnd:"23:00", dayStart:4 },
  log: {},            // dayKey -> [{t:ms, n:1|2, tag:null|string}]
  slips: [],          // {day, step, until}
  slipStep: 0,
  lockUntil: 0,
  urgesRidden: 0,
  urgesLog: {},       // dayKey -> count
  sound: true,
  tab: "today"
};

/* ---------- storage ---------- */
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return clone(DEFAULTS);
    const d = JSON.parse(raw);
    return Object.assign(clone(DEFAULTS), d,
      { setup: Object.assign(clone(DEFAULTS.setup), d.setup||{}) });
  }catch(e){ return clone(DEFAULTS); }
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Couldn't save — storage is full or blocked"); } }

/* ---------- dates ---------- */
const MS_DAY = 86400000;
function shifted(d){ const x = new Date(d.getTime()); x.setHours(x.getHours() - S.setup.dayStart); return x; }
function keyOf(d){ const x = shifted(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function today(){ return keyOf(new Date()); }
function keyToDate(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d, 12); }
function daysBetween(a,b){ return Math.round((keyToDate(b) - keyToDate(a)) / MS_DAY); }
function keyPlus(k,n){ const d = keyToDate(k); d.setDate(d.getDate()+n); return keyOf(new Date(d.getFullYear(),d.getMonth(),d.getDate(),12)); }
function shortDay(k){ return keyToDate(k).toLocaleDateString(undefined,{weekday:"short"}); }
function prettyDay(k){ return keyToDate(k).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }

/* ---------- plan math ---------- */
function dayIndex(k){ if(!S.setup.start) return 0; return daysBetween(S.setup.start, k || today()); }
function allowanceFor(i){
  const B = S.setup.baseline, N = S.setup.taperDays;
  if(i < 0) return B;
  if(i >= N) return 0;
  const t = i / N;
  const f = S.setup.curve === "gentle" ? Math.pow(1-t, 1.7) : (1-t);
  return Math.max(1, Math.round(B * f));
}
function hitsOn(k){ return (S.log[k]||[]).reduce((a,h)=>a+h.n, 0); }
function phase(){
  if(!S.setup.done) return "setup";
  if(Date.now() < S.lockUntil) return "lock";
  return dayIndex() >= S.setup.taperDays ? "free" : "taper";
}
function freeSince(){
  // first day with zero allowance, or the day after the last slip
  const end = keyPlus(S.setup.start, S.setup.taperDays);
  if(S.slips.length){
    const last = S.slips[S.slips.length-1];
    return keyPlus(last.day, 1);
  }
  return end;
}
function cleanDays(){
  const from = freeSince();
  const d = daysBetween(from, today());
  return Math.max(0, d);
}
function bestClean(){
  // longest run of zero-hit days ever recorded, plus the current run
  const keys = Object.keys(S.log).sort();
  let best = cleanDays();
  if(!S.setup.start) return best;
  let run = 0;
  let k = S.setup.start;
  while(daysBetween(k, today()) >= 0){
    if(hitsOn(k) === 0 && daysBetween(S.setup.start,k) >= S.setup.taperDays){ run++; best = Math.max(best, run); }
    else run = 0;
    k = keyPlus(k,1);
  }
  return best;
}

/* ---------- pacing gate ---------- */
function wakeMinutes(){
  const [h1,m1] = S.setup.wakeStart.split(":").map(Number);
  const [h2,m2] = S.setup.wakeEnd.split(":").map(Number);
  let mins = (h2*60+m2) - (h1*60+m1);
  if(mins <= 60) mins += 1440;
  return mins;
}
function spacingMs(){
  const a = allowanceFor(dayIndex());
  if(a <= 0) return 0;
  return Math.round(wakeMinutes() / a) * 60000;
}
function lastHitTs(){
  const arr = S.log[today()] || [];
  return arr.length ? arr[arr.length-1].t : 0;
}
function gateLeft(){
  const sp = spacingMs(); if(!sp) return 0;
  const l = lastHitTs(); if(!l) return 0;
  return Math.max(0, l + sp - Date.now());
}

/* ---------- sound ---------- */
let AC = null;
function blip(freq, dur, type){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type||"sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.16, AC.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+(dur||.18));
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+(dur||.18)+.02);
  }catch(e){}
}
const sndGood = ()=>{ blip(660,.1); setTimeout(()=>blip(990,.16),90); };
const sndTap  = ()=> blip(420,.09,"triangle");
const sndSoft = ()=> blip(300,.22,"sine");

/* ---------- ui helpers ---------- */
const app = document.getElementById("app");
let toastT;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("show"), 2600);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtLeft(ms){
  if(ms <= 0) return "0s";
  const s = Math.floor(ms/1000), d = Math.floor(s/86400), h = Math.floor(s%86400/3600),
        m = Math.floor(s%3600/60), ss = s%60;
  if(d) return d+"d "+h+"h "+m+"m";
  if(h) return h+"h "+m+"m";
  if(m) return m+"m "+ss+"s";
  return ss+"s";
}

/* ---------- modal ---------- */
function modal(html){
  const s = document.createElement("div");
  s.className = "scrim";
  s.innerHTML = '<div class="modal">'+html+'</div>';
  s.addEventListener("click", e=>{ if(e.target === s) s.remove(); });
  document.body.appendChild(s);
  return s;
}

function dial(pct, centerHTML){
  const R = 96, C = 2*Math.PI*R;

  return `<div class="dial">
    <svg viewBox="0 0 210 210" aria-hidden="true">
      <circle class="track" cx="105" cy="105" r="${R}"></circle>
      <circle class="prog" cx="105" cy="105" r="${R}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"></circle>
    </svg>
    <div class="inner">${centerHTML}</div>
  </div>`;
}

/* ---------- logging ---------- */
function logHit(n){
  const k = today();
  S.log[k] = S.log[k] || [];
  S.log[k].push({ t: Date.now(), n: n, tag: null });
  const cap = allowanceFor(dayIndex());
  const used = hitsOn(k);
  save(); sndTap();

  if(phase() === "lock" || (dayIndex() >= S.setup.taperDays)){
    // logging during the clean phase is a slip
    applySlip();
    return;
  }
  render();
  if(used === cap) toast("That's the cap. Ride the rest out.");
  else if(used > cap) toast(used-cap+" over — logged. Tomorrow still steps down.");
  askTag();
}

function askTag(){
  const k = today(), arr = S.log[k]; if(!arr || !arr.length) return;
  const host = document.createElement("div");
  host.className = "card";
  host.innerHTML = `<span class="label">WHAT WAS BEHIND IT?</span>
    <div class="tags">${TAGS.map(t=>`<button class="tag" data-t="${t}">${t}</button>`).join("")}
    <button class="tag" data-t="">skip</button></div>`;
  app.appendChild(host);
  host.scrollIntoView({behavior:"smooth", block:"end"});
  host.querySelectorAll(".tag").forEach(b=>b.onclick=()=>{
    if(b.dataset.t){ arr[arr.length-1].tag = b.dataset.t; save(); }
    host.remove(); sndTap();
  });
  setTimeout(()=>{ if(host.isConnected) host.remove(); }, 14000);
}

function confirmSlip(){
  const step = S.slipStep + 1;
  const m = modal(`<h3>Log a slip?</h3>
    <p class="mut">This starts a ${step}-day hold and resets your clean count. It doesn't undo anything you've already done.</p>
    <div class="row"><button class="btn ghost" id="no">Cancel</button><button class="btn mg" id="yes">Log it</button></div>`);
  m.querySelector("#no").onclick = ()=>m.remove();
  m.querySelector("#yes").onclick = ()=>{ m.remove(); const k=today(); S.log[k]=S.log[k]||[];
    S.log[k].push({t:Date.now(), n:1, tag:null}); applySlip(); };
}

function applySlip(){
  S.slipStep = S.slipStep + 1;
  S.lockUntil = Date.now() + S.slipStep * MS_DAY;
  S.slips.push({ day: today(), step: S.slipStep, until: S.lockUntil });
  save(); sndSoft(); render();
  toast(S.slipStep+"-day hold started. You're still in this.");
}

let urgeT = null;
function urgeFlow(){
  const idea = URGE_IDEAS[Math.floor(Math.random()*URGE_IDEAS.length)];

/* ============================================================
   HISTORY
   ============================================================ */
function renderHistory(){
  if(!S.setup.done) return renderSetup();
  const days = [];
  for(let n=13; n>=0; n--){
    const k = keyPlus(today(), -n);
    const i = dayIndex(k);
    days.push({ k, used: hitsOn(k), cap: i>=0 ? allowanceFor(i) : null, i });
  }
  const peak = Math.max(4, ...days.map(d=>Math.max(d.used, d.cap||0)));

  const bars = days.map(d=>{
    const h = Math.round((d.used/peak)*100);
    const capH = d.cap!=null ? Math.round((d.cap/peak)*100) : null;
    const cls = d.used===0 ? "zero" : (d.cap!=null && d.used>d.cap ? "over" : "");
    return `<div class="bcol"><div class="bwrap">
      ${capH!=null?`<div class="bcap" style="bottom:${capH}%"></div>`:""}
      <div class="bfill ${cls}" style="height:${h}%"></div>
    </div><span class="blab">${shortDay(d.k)[0]}</span></div>`;
  }).join("");

  // totals
  const allKeys = Object.keys(S.log).sort();
  const total = allKeys.reduce((a,k)=>a+hitsOn(k),0);
  const first7 = allKeys.slice(0,7).reduce((a,k)=>a+hitsOn(k),0) / Math.max(1, Math.min(7, allKeys.length));
  const last7 = days.slice(-7).reduce((a,d)=>a+d.used,0)/7;
  const drop = first7 > 0 ? Math.round((1 - last7/first7)*100) : 0;

  // triggers
  const counts = {};
  allKeys.forEach(k => (S.log[k]||[]).forEach(h=>{ if(h.tag) counts[h.tag]=(counts[h.tag]||0)+h.n; }));
  const trig = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const trigMax = trig.length ? trig[0][1] : 1;

  const list = days.slice().reverse().map(d=>{
    const st = d.used===0 ? '<span class="pill ok">clean</span>'
      : (d.cap!=null && d.used>d.cap ? `<span class="pill over">${d.used-d.cap} over</span>`
      : `<span class="pill">under cap</span>`);
    return `<div class="li"><span>${prettyDay(d.k)} <span class="mut">${shortDay(d.k)}</span></span>
      <span style="display:flex;align-items:center;gap:10px"><b>${d.used}</b>${d.cap!=null?`<span class="mut">/${d.cap}</span>`:""} ${st}</span></div>`;
  }).join("");

  app.innerHTML = header() + `
  <div class="card">
    <span class="label">LAST 14 DAYS</span>
    <div class="bars">${bars}</div>
    <p class="mut center" style="margin:14px 0 0">Dotted line is that day's cap.</p>
  </div>

  <div class="card">
    <span class="label">WHERE YOU'RE AT</span>
    <div class="li"><span>Daily average, last 7</span><b>${last7.toFixed(1)}</b></div>
    <div class="li"><span>Down from your first week</span><b>${drop>0?drop+"%":"—"}</b></div>
    <div class="li"><span>Urges ridden out</span><b>${S.urgesRidden}</b></div>
    <div class="li"><span>Hits logged, all time</span><b>${total}</b></div>
    <div class="li"><span>Slips since going clean</span><b>${S.slips.length}</b></div>
  </div>

  ${trig.length ? `<div class="card">
    <span class="label">WHAT SETS IT OFF</span>
    ${trig.map(([t,c])=>`<div style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(t)}</span><b>${c}</b></div>
      <div style="height:6px;background:var(--panel2);border-radius:99px;margin-top:5px;overflow:hidden">
        <div style="height:100%;width:${Math.round(c/trigMax*100)}%;background:linear-gradient(90deg,var(--mg),var(--cy))"></div>
      </div></div>`).join("")}
  </div>` : `<div class="card"><span class="label">WHAT SETS IT OFF</span>
    <p class="mut" style="margin:10px 0 0">Tag a few hits as you log them and the pattern shows up here.</p></div>`}

  <div class="card">
    <span class="label">DAY BY DAY</span>
    ${list}
  </div>`;
}

  settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H7a1.7 1.7 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H23a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};
function renderNav(){
  document.getElementById("nav").innerHTML = ["today","history","settings"].map(t=>
    `<button data-t="${t}" class="${S.tab===t?'on':''}">${ICONS[t]}<span class="tabname">${t.toUpperCase()}</span></button>`).join("");
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{ sndTap(); go(b.dataset.t); });
}
function go(t){ S.tab = t; save(); renderNav(); render(); window.scrollTo(0,0); }
function render(){
  if(S.tab === "history") renderHistory();
  else if(S.tab === "settings") renderSettings();
  else renderToday();
}

/* live countdowns */
setInterval(()=>{
  if(S.tab !== "today" || !S.setup.done) return;
  if(document.querySelector(".scrim")) return;
  const p = phase();
  if(p === "lock"){
    const el = document.querySelector(".big.lock");
    if(el) el.textContent = fmtLeft(S.lockUntil - Date.now());
    else renderToday();
    return;
  }
  if(document.querySelector(".big.lock")){ renderToday(); return; }
  const g = document.querySelector(".gate");
  if(g && p === "taper"){
    const left = gateLeft();
    if(left <= 0){ if(!g.classList.contains("open")) renderToday(); }
    else { g.textContent = "next one in " + fmtLeft(left);
      const prog = document.querySelector(".prog");
      if(prog){ const C = 2*Math.PI*96, pct = 1 - (left/(spacingMs()||1));
        prog.setAttribute("stroke-dashoffset", (C*(1-pct)).toFixed(1)); } }
  }
}, 1000);

/* roll over at midnight-ish */
let lastKey = today();
setInterval(()=>{ const k = today(); if(k !== lastKey){ lastKey = k; render(); } }, 30000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ lastKey = today(); render(); } });

/* ---------- background grid ---------- */
(function(){
  const c = document.getElementById("grid"), x = c.getContext("2d");
  let W, H, t = 0;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio;
    c.style.width = innerWidth+"px"; c.style.height = innerHeight+"px"; }
  size(); addEventListener("resize", size);
  function draw(){
    x.clearRect(0,0,W,H);
    const hz = H*0.56, dpr = devicePixelRatio;
    const g = x.createLinearGradient(0,hz,0,H);
    g.addColorStop(0,"rgba(34,227,214,0)"); g.addColorStop(1,"rgba(255,61,154,.26)");
    x.strokeStyle = g; x.lineWidth = 1*dpr;
    for(let i=-14;i<=14;i++){ x.beginPath(); x.moveTo(W/2 + i*(W/9), hz); x.lineTo(W/2 + i*(W/1.6), H); x.stroke(); }
    for(let i=0;i<16;i++){
      const p = ((i + (t%1)) / 16), y = hz + Math.pow(p,2.6)*(H-hz);
      x.globalAlpha = Math.min(1, p*2.2) * .5;
      x.beginPath(); x.moveTo(0,y); x.lineTo(W,y); x.stroke();
    }
    x.globalAlpha = 1;
    if(!reduce){ t += 0.0035; requestAnimationFrame(draw); }
  }
  draw();
})();

renderNav();
render();
setTimeout(()=>document.getElementById("boot").classList.add("gone"), 1150);
